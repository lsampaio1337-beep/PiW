<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Catch Probability Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .sidebar {
            width: 320px;
            background-color: #1e1e1e;
            border-left: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }
        h1, h2, h3 { color: #ffffff; margin-top: 0; }
        .group {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            min-width: 150px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-group input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        .slider-group input[type="number"] {
            width: 80px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input[type="number"], input[type="text"], select {
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            width: 100%;
        }
        input[type="number"]:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #64b5f6;
        }
        input:disabled, select:disabled {
            background-color: #222;
            color: #666;
            cursor: not-allowed;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            cursor: pointer;
        }

        /* Live Search */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-top: none;
            z-index: 10;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 0 0 4px 4px;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .search-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background-color: #3d3d3d; }
        .search-item .poke-name { font-weight: bold; }
        .search-item .poke-bst { color: #888; font-size: 0.9em; }

        .result-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: 20px;
        }
        .result-text {
            font-size: 28px;
            font-weight: bold;
            color: #64b5f6;
        }
        button {
            background-color: #64b5f6;
            color: #121212;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #42a5f5; }

        /* Saved items */
        .saved-item {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            margin-bottom: 15px;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .saved-item:hover { border-color: #666; }
        .saved-header {
            padding: 12px;
            font-weight: bold;
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .saved-header .saved-chance { color: #64b5f6; }
        .saved-details {
            padding: 12px;
            display: none;
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
        }
        .saved-item.expanded .saved-details { display: block; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            padding: 4px 0;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #888; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>Pokemon Catch Probability Calculator</h1>

        <div class="group">
            <h2>Main Data</h2>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="searchInput">Search Pokemon (Auto-fills BST)</label>
                    <input type="text" id="searchInput" placeholder="Type name to search..." autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
                <div class="form-group">
                    <label for="level">Level</label>
                    <input type="number" id="level" value="5" min="1" max="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Base Stat Total (BST)</label>
                    <div class="slider-group">
                        <input type="range" id="bstSlider" min="180" max="700" value="318">
                        <input type="number" id="bst" min="180" max="700" value="318">
                    </div>
                </div>
                <div class="form-group">
                    <label>Quality (Q)</label>
                    <div class="slider-group">
                        <input type="range" id="qualitySlider" min="0.80" max="2.50" step="0.01" value="1.00">
                        <input type="number" id="quality" min="0.80" max="2.50" step="0.01" value="1.00">
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Total IV</label>
                    <div class="slider-group">
                        <input type="range" id="totalIVSlider" min="6" max="600" value="150">
                        <input type="number" id="totalIV" min="6" max="600" value="150">
                    </div>
                </div>
                <div class="form-group">
                    <label for="ball">Pokeball Type</label>
                    <select id="ball">
                        <option value="1.0">Pokeball (1.0x)</option>
                        <option value="1.5">Greatball (1.5x)</option>
                        <option value="2.0">Ultraball (2.0x)</option>
                        <option value="1.5">Safariball (1.5x)</option>
                        <option value="999.0">Masterball (999.0x)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="isShiny"> Is Shiny?
                    </label>
                </div>
            </div>
        </div>

        <div class="group">
            <h2>Bonuses Data</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="cTaskTier">Capture Task</label>
                    <select id="cTaskTier">
                        <option value="0">Tier 0 - No Bonus (0%)</option>
                        <option value="1">Tier 1 - +5%</option>
                        <option value="2">Tier 2 - +10%</option>
                        <option value="3">Tier 3 - +15%</option>
                        <option value="4">Tier 4 - +20%</option>
                        <option value="5">Tier 5 - +25%</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="blackYellowCandies">Black Yellow Candies</label>
                    <input type="number" id="blackYellowCandies" value="0" min="0">
                </div>
                <div class="form-group">
                    <label for="shinySeenTaskTier">Shiny Task</label>
                    <select id="shinySeenTaskTier" disabled>
                        <option value="0">Tier 0 - No Bonus (1x)</option>
                        <option value="1">Tier 1 - No Bonus (1x)</option>
                        <option value="2">Tier 2 - No Bonus (1x)</option>
                        <option value="3">Tier 3 - 2x Multiplier</option>
                        <option value="4">Tier 4 - 2x Multiplier</option>
                        <option value="5">Tier 5 - 2x Multiplier</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="result-container">
            <div class="result-text" id="result">Catch Probability: 0%</div>
            <button id="saveBtn">Save</button>
        </div>
    </div>

    <div class="sidebar">
        <h2>Saved Configs</h2>
        <div id="savedList">
            <!-- Saved items go here -->
        </div>
    </div>

    <script>
        let pokemonData = [];
        let currentChance = 0;
        let selectedPokemonName = null;

        // Load Pokemon Data
        fetch('../data/pokemon_base.json')
            .then(res => res.json())
            .then(data => {
                pokemonData = data;
            })
            .catch(err => console.error("Error loading pokemon data:", err));

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        // Sync sliders and inputs
        const bstSlider = document.getElementById('bstSlider');
        const bstInput = document.getElementById('bst');

        const qSlider = document.getElementById('qualitySlider');
        const qInput = document.getElementById('quality');

        const ivSlider = document.getElementById('totalIVSlider');
        const ivInput = document.getElementById('totalIV');

        function syncInput(source, target) {
            target.value = source.value;
            calculateCatchChance();
        }

        bstSlider.addEventListener('input', () => { selectedPokemonName = null; searchInput.value = ''; syncInput(bstSlider, bstInput); });
        bstInput.addEventListener('input', () => { selectedPokemonName = null; searchInput.value = ''; syncInput(bstInput, bstSlider); });

        qSlider.addEventListener('input', () => syncInput(qSlider, qInput));
        qInput.addEventListener('input', () => syncInput(qInput, qSlider));

        ivSlider.addEventListener('input', () => syncInput(ivSlider, ivInput));
        ivInput.addEventListener('input', () => syncInput(ivInput, ivSlider));

        // Live search logic
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            selectedPokemonName = null;

            if (!val) {
                searchResults.style.display = 'none';
                return;
            }

            const matches = pokemonData.filter(p => p.name.toLowerCase().includes(val)).slice(0, 10);

            if (matches.length > 0) {
                searchResults.innerHTML = '';
                matches.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<span class="poke-name">${p.name}</span><span class="poke-bst">BST: ${p.stats.Total}</span>`;
                    div.addEventListener('click', () => {
                        selectedPokemonName = p.name;
                        searchInput.value = p.name;
                        bstSlider.value = p.stats.Total;
                        bstInput.value = p.stats.Total;
                        searchResults.style.display = 'none';
                        calculateCatchChance();
                    });
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else {
                searchResults.style.display = 'none';
            }
        });

        // Hide search results when clicking outside
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== searchResults) {
                searchResults.style.display = 'none';
            }
        });

        const isShinyCheckbox = document.getElementById('isShiny');
        const shinySeenTaskTierSelect = document.getElementById('shinySeenTaskTier');

        isShinyCheckbox.addEventListener('change', (e) => {
            shinySeenTaskTierSelect.disabled = !e.target.checked;
            calculateCatchChance();
        });

        function calculateCatchChance() {
            let bst = parseFloat(bstInput.value) || 0;
            let level = parseFloat(document.getElementById('level').value) || 1;
            let quality = parseFloat(qInput.value) || 1.0;
            let totalIV = parseFloat(ivInput.value) || 6;
            let ballMultiplier = parseFloat(document.getElementById('ball').value) || 1.0;
            let isShiny = isShinyCheckbox.checked;

            let cTaskTier = parseInt(document.getElementById('cTaskTier').value) || 0;
            let shinySeenTaskTier = parseInt(shinySeenTaskTierSelect.value) || 0;
            let blackYellowCandies = parseInt(document.getElementById('blackYellowCandies').value) || 0;

            if (ballMultiplier >= 10) {
                currentChance = 100;
                document.getElementById('result').innerText = `Catch Probability: 100%`;
                return;
            }

            let catchBonus = 0;
            if (cTaskTier >= 5) catchBonus = 25;
            else if (cTaskTier >= 4) catchBonus = 20;
            else if (cTaskTier >= 3) catchBonus = 15;
            else if (cTaskTier >= 2) catchBonus = 10;
            else if (cTaskTier >= 1) catchBonus = 5;

            let shinyCatchMulti = (isShiny && shinySeenTaskTier >= 3) ? 2 : 1;

            let baseChance = 74.0 - (bst / 14.6) - (level / 4.0) - 8.0 * ((quality - 0.8) / 1.0) - 5.0 * (totalIV / 600);

            let chance = baseChance * ballMultiplier * (1 + catchBonus / 100) * shinyCatchMulti;

            const blackYellowMulti = 1 + (0.20 * blackYellowCandies);
            chance = chance * blackYellowMulti;

            chance = Math.min(100.0, chance);
            currentChance = chance;

            document.getElementById('result').innerText = `Catch Probability: ${chance.toFixed(2)}%`;
        }

        // Add event listeners to all other inputs to recalculate on change
        document.querySelectorAll('input:not(#searchInput):not([type="range"]), select').forEach(el => {
            el.addEventListener('input', calculateCatchChance);
            el.addEventListener('change', calculateCatchChance);
        });

        // Save logic
        document.getElementById('saveBtn').addEventListener('click', () => {
            const bstVal = bstInput.value;
            const level = document.getElementById('level').value;
            const q = qInput.value;
            const iv = ivInput.value;
            const ballSel = document.getElementById('ball');
            const ballName = ballSel.options[ballSel.selectedIndex].text.split(' ')[0];
            const isShiny = document.getElementById('isShiny').checked;

            const cTaskText = document.getElementById('cTaskTier').options[document.getElementById('cTaskTier').selectedIndex].text;
            const byCandies = document.getElementById('blackYellowCandies').value;

            let shinyTaskText = "N/A";
            if (isShiny) {
                shinyTaskText = shinySeenTaskTierSelect.options[shinySeenTaskTierSelect.selectedIndex].text;
            }

            const itemName = selectedPokemonName || `BST ${bstVal}`;

            const savedItem = document.createElement('div');
            savedItem.className = 'saved-item';

            savedItem.innerHTML = `
                <div class="saved-header">
                    <span>${itemName} ${isShiny ? '✨' : ''}</span>
                    <span class="saved-chance">${currentChance.toFixed(2)}%</span>
                </div>
                <div class="saved-details">
                    <div class="detail-row"><span class="detail-label">BST</span> <span>${bstVal}</span></div>
                    <div class="detail-row"><span class="detail-label">Level</span> <span>${level}</span></div>
                    <div class="detail-row"><span class="detail-label">Quality</span> <span>${q}</span></div>
                    <div class="detail-row"><span class="detail-label">Total IV</span> <span>${iv}</span></div>
                    <div class="detail-row"><span class="detail-label">Ball</span> <span>${ballName}</span></div>
                    <div class="detail-row"><span class="detail-label">Capture Task</span> <span>${cTaskText}</span></div>
                    <div class="detail-row"><span class="detail-label">BY Candies</span> <span>${byCandies}</span></div>
                    <div class="detail-row"><span class="detail-label">Shiny Task</span> <span>${shinyTaskText}</span></div>
                </div>
            `;

            savedItem.addEventListener('click', () => {
                savedItem.classList.toggle('expanded');
            });

            document.getElementById('savedList').prepend(savedItem);
        });

        // Initial calculation
        calculateCatchChance();
    </script>
</body>
</html>
