<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Idle Pokemon World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top Bar (Icons) -->
  <div id="top-bar">
    <div id="nav-buttons">
      <img src="Assets/Extra/IconMap.png" id="btn-map" class="nav-icon" title="Map">
      <img src="Assets/Extra/IconBackpack.png" id="btn-backpack" class="nav-icon" title="Backpack">
      <img src="Assets/Extra/IconPokedex.png" id="btn-dex" class="nav-icon" title="Pokedex">
      <img src="Assets/Extra/IconTrainer.png" id="btn-stats" class="nav-icon" title="Trainer">

      <span class="nav-divider"></span>


      <div style="position: relative; display: inline-block; height: 100%;">
          <img src="Assets/Extra/BonusCandy.png" id="btn-bonus-candy" class="nav-icon" title="Bonus Candy">
          <img src="Assets/Extra/ExclamationMark.png" id="bonus-candy-exclamation" style="position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; display: none; pointer-events: none; z-index: 10;">
      </div>
      <img src="Assets/Extra/IconGift.png" id="btn-gift" class="nav-icon" title="Gift">
      <div style="position: relative; display: inline-block; height: 100%;">
        <img src="Assets/Extra/IconCalendar.png" id="btn-calendar" class="nav-icon" title="Calendar" style="display: block;">
        <img src="Assets/Extra/ExclamationMark.png" id="calendar-notification" style="display: none; position: absolute; top: -5px; right: -5px; width: 15px; height: auto; pointer-events: none; z-index: 10;">
      </div>
      <img src="Assets/Extra/ProgressChallange.png" id="btn-challenges" class="nav-icon" title="Progress Challenges">

      <span class="nav-divider"></span>

      <img src="Assets/Extra/IconSleep.png" id="btn-sleep" class="nav-icon" title="Sleep">
      <img src="Assets/Extra/IconHelp.png" id="btn-help" class="nav-icon" title="Help">
      <img src="Assets/Extra/IconSettings.png" id="btn-settings" class="nav-icon" title="Settings">
      <img src="Assets/Extra/IconExit.png" id="btn-exit" class="nav-icon" title="Exit">
    </div>
  </div>

  <!-- Splash Screen / Save Manager -->
  <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 1000; display: flex; justify-content: center; align-items: center;">

    <div id="save-manager-modal" style="display: none; background-color: rgba(0,0,0,0.9); padding: 2vw; border-radius: 8px; text-align: center; border: 2px solid white; max-width: 90vw; max-height: 90vh; overflow-y: auto; width: 50vw; min-width: 400px; display: flex; flex-direction: column; gap: 2vh; resize: both;">
        <h2 style="color: white; margin-top: 0;">Save Profiles</h2>

        <div id="profiles-container" style="display: flex; flex-direction: column; gap: 1vh; flex-grow: 1; overflow-y: auto;">
            <!-- Dynamic profile buttons will go here -->
        </div>

        <div style="display: flex; gap: 1vw; justify-content: center; margin-top: 1vh; flex-wrap: wrap;">
            <button id="btn-new-profile" style="padding: 1vh 1vw; font-size: 1rem; font-weight: bold; cursor: pointer; background-color: #FFC107; color: black; border: none; border-radius: 5px; flex: 1; min-width: 100px;">New Game</button>
            <button id="btn-rename-profile" style="padding: 1vh 1vw; font-size: 1rem; font-weight: bold; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 5px; flex: 1; min-width: 100px;">Rename</button>
            <button id="btn-erase-profile" style="padding: 1vh 1vw; font-size: 1rem; font-weight: bold; cursor: pointer; background-color: #f44336; color: white; border: none; border-radius: 5px; flex: 1; min-width: 100px;">Erase</button>
        </div>
    </div>

    <!-- Custom Rename Modal Overlay -->
    <div id="rename-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1010; justify-content: center; align-items: center;">
        <div style="background-color: #2c3e50; padding: 20px; border-radius: 8px; text-align: center; border: 2px solid white; display: flex; flex-direction: column; gap: 15px; width: 300px;">
            <h3 style="color: white; margin: 0;">Rename Profile</h3>
            <input type="text" id="rename-input" style="padding: 10px; font-size: 16px; border-radius: 5px; border: none; width: 100%; box-sizing: border-box;" placeholder="Enter new name...">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-rename-save" style="padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; flex: 1;">Save</button>
                <button id="btn-rename-cancel" style="padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #f44336; color: white; border: none; border-radius: 5px; flex: 1;">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <div id="main-container">
    <!-- Left Column: Party & Day Care -->
    <aside id="left-col">
      <h3>Party</h3>
      <div id="party-list">
        <!-- JS will populate 6 slots here -->
      </div>
      <div id="day-care">
        <h3>Day Care</h3>
        <div id="dc-slot1"></div>
        <div id="dc-slot2"></div>
      </div>
    </aside>

    <!-- Center Column: Dynamic View State -->
    <main id="center-col">

      <!-- View 1: Oak's Lab -->
      <div id="view-prof-oak-lab" class="game-view" style="display:none; background-image: url('./Assets/BG/BG-Professor-Oak-Lab.png'); text-align: center;">
        <div style="background-color: rgba(0,0,0,0.8); display: inline-block; padding: 30px; margin-top: 50px; border-radius: 8px;">
            <h2>Choose your Starter Pokémon</h2>
            <div class="starter-choices">
              <button id="choose-bulbasaur">
                <img src="Assets/Pokemon Sprites/1.png" style="width: 80px; height: 80px;"><br>Bulbasaur
              </button>
              <button id="choose-charmander">
                <img src="Assets/Pokemon Sprites/4.png" style="width: 80px; height: 80px;"><br>Charmander
              </button>
              <button id="choose-squirtle">
                <img src="Assets/Pokemon Sprites/7.png" style="width: 80px; height: 80px;"><br>Squirtle
              </button>
            </div>
        </div>
      </div>

      <!-- View 2: Battle Arena -->
      <div id="view-battle-arena" class="game-view" style="display:none;">
        <div id="combat-arena">
          <div id="enemy-side">
            <div style="width: 200px; height: 18px; background: #222; border: 1px solid #000; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: white; text-shadow: 1px 1px 1px black, -1px -1px 1px black, 1px -1px 1px black, -1px 1px 1px black; box-shadow: inset 0px 1px 3px rgba(0,0,0,0.5); z-index: 5;" id="enemy-battle-hp-container">
                <div id="enemy-battle-hp-bar" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #2ecc71; z-index: 0; transition: width 0.3s, background 0.3s; border-radius: 8px;"></div>
                <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex;">
                    <div id="enemy-battle-hp-text" style="flex: 1; text-align: center; z-index: 1; display: flex; align-items: center; justify-content: center; line-height: 1;">?/?</div>
                    <div style="flex: 1; text-align: center; z-index: 1; display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 10px; color: white;">HP</div>
                    <div id="enemy-battle-hp-pct" style="flex: 1; text-align: center; z-index: 1; display: flex; align-items: center; justify-content: center; line-height: 1;">100%</div>
                </div>
            </div>
            <img id="enemy-sprite" src="" alt="Enemy Sprite">
          </div>

          <div id="player-side">
            <div style="width: 200px; height: 18px; background: #222; border: 1px solid #000; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: white; text-shadow: 1px 1px 1px black, -1px -1px 1px black, 1px -1px 1px black, -1px 1px 1px black; box-shadow: inset 0px 1px 3px rgba(0,0,0,0.5); z-index: 5;" id="player-battle-hp-container">
                <div id="player-battle-hp-bar" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #2ecc71; z-index: 0; transition: width 0.3s, background 0.3s; border-radius: 8px;"></div>
                <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex;">
                    <div id="player-battle-hp-text" style="flex: 1; text-align: center; z-index: 1; display: flex; align-items: center; justify-content: center; line-height: 1;">?/?</div>
                    <div style="flex: 1; text-align: center; z-index: 1; display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 10px; color: white;">HP</div>
                    <div id="player-battle-hp-pct" style="flex: 1; text-align: center; z-index: 1; display: flex; align-items: center; justify-content: center; line-height: 1;">100%</div>
                </div>
            </div>
            <img id="player-sprite" src="" alt="Player Sprite">
          </div>
        </div>

        <div id="combat-log">
          <!-- Combat text/updates -->
        </div>
      </div>

      <!-- View 3: PokeCenter & PokeMarket -->
      <div id="view-center-market" class="game-view" style="display:none;">
        <h2>PokeCenter & PokeMarket</h2>
        <p>Work in Progress...</p>
      </div>

      <!-- View 4: Gym -->
      <div id="view-gym" class="game-view" style="display:none;">
        <h2>Gym Challenge</h2>
        <p>Work in Progress...</p>
      </div>

      <!-- View 5: Casino Hub -->
      <div id="view-casino" class="game-view" style="display:none; background-image: url('./Assets/BG/BG-Cassino.jpg'); text-align: center; background-size: cover; height: 100%; position: relative;">
        <!-- Casino Content Container, so we can hide/show lobby vs specific background overlays -->
        <div id="casino-content" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            <div id="casino-buttons-container" style="display: flex; flex-direction: row; gap: 10px;">
                <!-- Dynamically injected -->
            </div>
        </div>
      </div>

      <!-- View 6: Daycare Hub -->
      <div id="view-daycare" class="game-view" style="display:none; background-image: url('./Assets/BG/BG-Daycare.png'); background-size: cover; background-position: center; height: 100%; position: relative;">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 50px; box-sizing: border-box;">
            <!-- Train Button (Left) -->
            <div style="background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; text-align: center;">
                <h3 style="color: white; margin-top: 0;">Training Area</h3>
                <button onclick="window.showBackpackAndFocus('pokemon')" style="padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; background: #3498db; color: white; border: none; font-weight: bold;">Train Pokémon</button>
            </div>

            <!-- Breed Button (Right) -->
            <div style="background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; text-align: center;">
                <h3 style="color: white; margin-top: 0;">Breeding Area</h3>
                <button onclick="window.showBackpackAndFocus('pokemon')" style="padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; background: #e74c3c; color: white; border: none; font-weight: bold;">Breed Pokémon</button>
            </div>
        </div>
      </div>

    </main>

    <!-- Right Column (Modals/Overlays for Map, Backpack, etc) -->

    <!-- Center Modal Overlay (replaces right-col) -->
    <div id="modal-overlay" class="modal" onclick="if(event.target === this && window.closeModal) window.closeModal()">
        <div id="modal-content-box" class="modal-content" style="width: 80%; max-width: 800px; max-height: 90vh; overflow-y: auto; position: relative;">
            <div id="content-panel">
                <!-- Dynamic content injected here -->
            </div>
        </div>
    </div>

  </div>

  <!-- Bottom Bar (Challenge Tracker) -->
  </div>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
