<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #333; margin: 0; padding: 20px; font-family: sans-serif; }
        .modal-content {
            background: #2a3b4c;
            border-radius: 8px;
            border: 2px solid #3eb0a9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 800px;
            display: flex;
            flex-direction: column;
        }
        .window-header {
            background: #3eb0a9;
            padding: 10px;
            color: white;
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .content-panel {
            padding: 2%;
            box-sizing: border-box;
        }
        .medal-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
            min-height: 0;
        }
        .medal-img-placeholder {
            width: 64px;
            height: 64px;
            background: gold;
        }
    </style>
</head>
<body>
    <div class="modal-content">
        <div class="window-header">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                <div style="font-weight: bold; font-size: 18px;">Trainer</div>
                <div style="display: inline-flex; background: rgba(0, 0, 0, 0.2); border-radius: 20px; padding: 3px; gap: 5px;">
                    <button style="padding: 5px 15px;">Statistics</button>
                    <button style="padding: 5px 15px;">Medals</button>
                </div>
            </div>
        </div>
        <div class="window-content-container">
            <div class="content-panel">
                <div id="medals-grid-original" style="display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); gap: 10px; padding: 10px; height: 100%; overflow: hidden; box-sizing: border-box;">
                    <!-- Row 1 -->
                    <div class="medal-item"><div class="medal-img-placeholder"></div></div>
                    <div class="medal-item"><div class="medal-img-placeholder"></div></div>
                </div>
                <hr>
                <div id="medals-grid-new" style="display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); gap: 10px; padding: 4px 10px 16px 10px; box-sizing: border-box;">
                    <!-- Row 1 -->
                    <div class="medal-item"><div class="medal-img-placeholder"></div></div>
                    <div class="medal-item"><div class="medal-img-placeholder"></div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
