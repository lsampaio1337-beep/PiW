<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #333; margin: 0; padding: 20px; font-family: sans-serif; }
        .modal-content {
            background: #2a3b4c;
            border-radius: 8px;
            border: 2px solid #3eb0a9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .window-header {
            background: #3eb0a9;
            padding: 10px;
            color: white;
            text-align: center;
        }
        .content-panel {
            padding: 2%;
            box-sizing: border-box;
        }
        .medal-item {
            background: red;
            height: 30px; /* mock height for testing */
        }
    </style>
</head>
<body>
    <div class="modal-content" style="width: 800px; height: auto; display: flex; flex-direction: column;">
        <div class="window-header">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                <div style="font-weight: bold; font-size: 18px;">Trainer</div>
                <div style="display: inline-flex; background: rgba(0, 0, 0, 0.2); border-radius: 20px; padding: 3px; gap: 5px;">
                    <button>Statistics</button>
                    <button>Medals</button>
                </div>
            </div>
        </div>
        <div class="window-content-container">
            <div class="window-content-scaler">
                <div class="content-panel" style="flex: 1; overflow-y: auto;">
                    <div id="medals-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); gap: 10px; padding: 10px; height: 100%; overflow: hidden; box-sizing: border-box;">
                        <div class="medal-item">1</div><div class="medal-item">2</div>
                        <div class="medal-item">3</div><div class="medal-item">4</div>
                        <div class="medal-item">5</div><div class="medal-item">6</div>
                        <div class="medal-item">7</div><div class="medal-item">8</div>
                        <div class="medal-item">9</div><div class="medal-item">10</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
