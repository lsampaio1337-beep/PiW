<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #333; color: white; display: flex; flex-wrap: wrap; gap: 20px; font-family: sans-serif; padding: 20px; }
        .container { text-align: center; width: 150px; background: #444; border-radius: 10px; padding: 10px; }
        img { width: 96px; height: 96px; object-fit: contain; }

        /* 21. Bounce & Tilt (Aggressive) */
        @keyframes anim21 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(10deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-15px) rotate(-10deg); }
        }
        .anim-21 { animation: anim21 0.5s infinite ease-out; }

        /* 22. Float & Skew */
        @keyframes anim22 {
            0%, 100% { transform: translateY(0) skewX(0deg); }
            25% { transform: translateY(-4px) skewX(2deg); }
            50% { transform: translateY(-8px) skewX(0deg); }
            75% { transform: translateY(-4px) skewX(-2deg); }
        }
        .anim-22 { animation: anim22 2s infinite ease-in-out; }

        /* 23. Trot & Bob */
        @keyframes anim23 {
            0%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
            25% { transform: translateY(-10px) rotate(4deg) scaleY(1.1); }
            50% { transform: translateY(0) rotate(0deg) scaleY(0.9); }
            75% { transform: translateY(-10px) rotate(-4deg) scaleY(1.1); }
        }
        .anim-23 { animation: anim23 0.6s infinite linear; }

        /* 24. Heavy Bob (Slow walk) */
        @keyframes anim24 {
            0%, 100% { transform: translateY(0) scaleY(0.9) scaleX(1.1); }
            20% { transform: translateY(-5px) scaleY(1) scaleX(1); }
            50% { transform: translateY(-10px) scaleY(1.05) scaleX(0.95); }
            80% { transform: translateY(-5px) scaleY(1) scaleX(1); }
        }
        .anim-24 { animation: anim24 0.8s infinite linear; }

        /* 25. Slither / Wiggle fast */
        @keyframes anim25 {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(2px) rotate(2deg); }
            50% { transform: translateX(0) rotate(0deg); }
            75% { transform: translateX(-2px) rotate(-2deg); }
        }
        .anim-25 { animation: anim25 0.3s infinite linear; }
    </style>
</head>
<body>
    <script>
        for (let i = 21; i <= 25; i++) {
            document.write(`
                <div class="container">
                    <div>Animation ${i}</div>
                    <img src="./Assets/Pokemon%20Sprites/Clean/66_Clean.png" class="anim-${i}" />
                </div>
            `);
        }
    </script>
</body>
</html>
